[project]
name = "ultimate-open-source-seo-toolkit"
version = "0.1.0"
description = "Self-hosted, open-source SEO platform: crawler, technical audit, keyword research, SERP and content analysis, monitoring and reporting."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "httpx>=0.27,<0.29",
    "lxml>=5.2",
    "trafilatura>=1.12",
    "tldextract>=5.1",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "openpyxl>=3.1",
    "reportlab>=4.2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
render = ["playwright>=1.45"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "I", "S"]
ignore = [
    "B008",  # FastAPI's Depends() in defaults is the documented idiom
    "E501",
    "S101",  # asserts are fine in tests
    "S110", "S112",  # deliberate best-effort try/except blocks are commented where used
    "S324",  # sha1 is used for content fingerprints, not security
    "S608",  # no SQL is built from user input; the single text() statement uses bound parameters
    "S603", "S607",  # the Lighthouse CLI is invoked with an argument list, never through a shell
    "S104",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
