# Default: one container with a SQLite database in a named volume.
#   docker compose up -d            -> http://localhost:8000 (published on this machine only)
# To reach it from other machines put an HTTPS reverse proxy in front, or set SEO_BIND=0.0.0.0 in .env.
# Optional PostgreSQL:
#   docker compose --profile postgres up -d
#   and set SEO_DATABASE_URL in .env (see .env.example)
services:
  app:
    build: .
    image: openseosuite:latest
    restart: unless-stopped
    ports:
      - "${SEO_BIND:-127.0.0.1}:${SEO_PORT:-8000}:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - path: .env
        required: false
    environment:
      SEO_DATA_DIR: /data
    volumes:
      - seo-data:/data

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: seotoolkit
      POSTGRES_USER: seotoolkit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - seo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seotoolkit"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  seo-data:
  seo-postgres:
