<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 96" width="1000" height="96" role="img" aria-label="Every number is labelled measured, imported, estimated or unavailable" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif"><g transform="translate(0.0 0)"><rect width="241.0" height="96" rx="12" fill="#1a7f37" fill-opacity="0.12" stroke="#1a7f37" stroke-opacity="0.55"/><circle cx="26" cy="32" r="7" fill="#1a7f37"/><text x="42" y="38" font-size="19" font-weight="700" fill="#1a7f37">Measured</text><text x="20" y="72" font-size="14" fill="#1a7f37">from your crawl or Google</text></g><g transform="translate(253.0 0)"><rect width="241.0" height="96" rx="12" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-opacity="0.55"/><circle cx="26" cy="32" r="7" fill="#0969da"/><text x="42" y="38" font-size="19" font-weight="700" fill="#0969da">Imported</text><text x="20" y="72" font-size="14" fill="#0969da">from files you provide</text></g><g transform="translate(506.0 0)"><rect width="241.0" height="96" rx="12" fill="#bf8700" fill-opacity="0.12" stroke="#bf8700" stroke-opacity="0.55"/><circle cx="26" cy="32" r="7" fill="#bf8700"/><text x="42" y="38" font-size="19" font-weight="700" fill="#bf8700">Estimated</text><text x="20" y="72" font-size="14" fill="#bf8700">a labelled heuristic</text></g><g transform="translate(759.0 0)"><rect width="241.0" height="96" rx="12" fill="#6e7781" fill-opacity="0.12" stroke="#6e7781" stroke-opacity="0.55"/><circle cx="26" cy="32" r="7" fill="#6e7781"/><text x="42" y="38" font-size="19" font-weight="700" fill="#6e7781">Unavailable</text><text x="20" y="72" font-size="14" fill="#6e7781">left empty, never guessed</text></g></svg>