name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
        exclude:
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.11" }
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t seo-toolkit:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name seo -p 8000:8000 seo-toolkit:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs seo
          exit 1
      - name: Smoke test docker compose
        shell: bash
        run: |
          # Failures are also written as annotations so they are readable without signing in to GitHub.
          note() { echo "::error title=$1::$(paste -sd' ' "$2" | cut -c1-1800)"; }
          docker rm -f seo
          if ! docker compose up -d --build > /tmp/compose-up.log 2>&1; then
            note "docker compose up failed" /tmp/compose-up.log
            cat /tmp/compose-up.log
            exit 1
          fi
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/api/health; then docker compose down -v; exit 0; fi
            sleep 2
          done
          docker compose ps -a > /tmp/compose-state.log 2>&1
          docker compose logs --no-color --tail 40 >> /tmp/compose-state.log 2>&1
          note "docker compose never became healthy" /tmp/compose-state.log
          cat /tmp/compose-state.log
          docker compose down -v
          exit 1
      - name: Smoke test docker compose with PostgreSQL
        shell: bash
        run: |
          note() { echo "::error title=$1::$(paste -sd' ' "$2" | cut -c1-1800)"; }
          PW=$(openssl rand -hex 16)
          printf 'POSTGRES_PASSWORD=%s\nSEO_DATABASE_URL=postgresql+psycopg://seotoolkit:%s@postgres:5432/seotoolkit\nSEO_ALLOW_REGISTRATION=true\n' "$PW" "$PW" > .env
          C="docker compose -f docker-compose.yml -f docker-compose.postgres.yml"
          if ! $C up -d --build > /tmp/pg-up.log 2>&1; then
            note "postgres compose up failed" /tmp/pg-up.log
            cat /tmp/pg-up.log
            exit 1
          fi
          ok=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/api/health; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            $C ps -a > /tmp/pg-state.log 2>&1
            $C logs --no-color --tail 40 >> /tmp/pg-state.log 2>&1
            note "postgres compose never became healthy" /tmp/pg-state.log
            cat /tmp/pg-state.log
            exit 1
          fi
          # A write through the API proves the migrations and the ORM work on PostgreSQL, not just that the process started.
          if ! curl -fsS -X POST http://127.0.0.1:8000/api/auth/register -H 'Content-Type: application/json' \
               -d '{"email":"ci@example.com","password":"correct horse battery"}' > /tmp/pg-register.log 2>&1; then
            $C logs --no-color --tail 40 app >> /tmp/pg-register.log 2>&1
            note "register against PostgreSQL failed" /tmp/pg-register.log
            exit 1
          fi
          $C exec -T postgres psql -U seotoolkit -d seotoolkit -tAc "select count(*) from users"
          $C down -v
          rm -f .env
