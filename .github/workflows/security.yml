name: Security

# Dependency advisories appear without any change to this repository, so this also runs weekly.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install ./backend pip-audit bandit
      - name: Dependency audit
        # GHSA-mmhr-3c5m-f64f (soupsieve): pulled in by beautifulsoup4, which this application never calls, and no fixed
        # release exists yet. See docs/SECURITY_REVIEW.md ("Accepted"). Remove the exception when a fix ships.
        run: pip-audit --ignore-vuln GHSA-mmhr-3c5m-f64f
      - name: Static analysis (medium severity and above)
        run: bandit -r backend/app -ll -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
      - name: Dependency audit
        run: npm audit --audit-level=moderate
